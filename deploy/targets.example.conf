# targets.conf — copy this file to deploy/targets.conf and fill it in.
# It is sourced by deploy.sh (bash syntax) and is gitignored. It holds no
# secret: the app secret lives in SECRET_FILE.

# Feishu / Lark app (Developer Console -> your custom app -> Credentials)
FEISHU_APP_ID=cli_xxxxxxxxxxxxxxxx
# The Base: from its URL  https://xxx.feishu.cn/base/<BASE_TOKEN>?table=...
FEISHU_BASE_TOKEN=XXXXXXXXXXXXXXXXXXXXXXXXXXX
# Feishu (China): https://open.feishu.cn    Lark (international): https://open.larksuite.com
FEISHU_BASE_URL=https://open.feishu.cn
# Optional CPU-load table (one row per box). Leave empty to skip it.
FEISHU_CPU_TABLE_ID=

# One line, mode 600:   FEISHU_APP_SECRET=...   Write it with: bash deploy/deploy.sh secret
SECRET_FILE=~/.config/gpu-board/secret

# Where the stack lives on each box (relative = under the remote $HOME).
REMOTE_DIR=gpu-board

# Optional tuning (defaults shown):
# PYTHON=python3            CYCLE_SECONDS=60        CPU_PUSH_SECONDS=300
# STALE_SECONDS=180         FREE_MEM_MB=2048        SERVE_IP_PROBE=1.1.1.1
# BOARD_UTC_OFFSET=8        (default: this machine's time zone)
# SERVE_PATTERNS="mycorp-serve"   WORKLOAD_PATTERNS="my_trainer"   (added to the built-ins)
# SSH_OPTS="-i ~/.ssh/gpu_key"

# One line per box - REPLACE these examples. The table id is PENDING until
# `deploy.sh setup ...` prints the real ones (tbl...).
#      name         ssh host (alias or user@host)   node label (节点)   GPU table id
target h200-a       gpu-h200-a                      h200-a              PENDING
target h200-b       gpu-h200-b                      h200-b              PENDING
target b200-a       root@10.0.0.12                  b200-a              PENDING
